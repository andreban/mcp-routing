[package]
name = "mcp-routing"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"

[dev-dependencies]
axum = { version = "0.8.9", features = ["multipart", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = "0.3.23"

[profile.dev]
debug = "line-tables-only"
